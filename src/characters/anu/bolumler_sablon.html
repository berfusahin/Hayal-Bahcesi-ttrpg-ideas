<link rel="stylesheet" href="stil.css">
<style>
  .intro { position: relative; overflow: hidden; }
  .intro .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 32px 64px; align-items: end; padding-block: clamp(40px, 7vw, 88px) clamp(32px, 5vw, 56px); }
  .intro h1 { font-size: clamp(3.2rem, 9vw, 6.6rem); line-height: .9; margin-top: 12px; }
  .intro h1 em { font-style: normal; color: var(--crimson); }
  .intro .lead { margin: 20px 0 0; max-width: 46ch; color: var(--muted); font-size: 1.1rem; }

  .toc { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .toc a { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: color .2s, padding .2s; }
  .toc a:hover { color: var(--crimson); padding-left: 6px; }
  .toc .n { font-family: var(--f-display); font-size: 1.3rem; color: var(--crimson); }
  .toc-label { margin-bottom: 8px; }
  @media (max-width: 820px) { .intro .wrap { grid-template-columns: minmax(0, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .toc a { transition: none; } .toc a:hover { padding-left: 0; } }

  .chapter { border-top: 1px solid var(--line); padding-block: clamp(48px, 8vw, 96px); scroll-margin-top: 64px; }
  .chapter > * { max-width: 1120px; margin-inline: auto; padding-inline: var(--gutter); }
  .ch-head { margin-bottom: clamp(24px, 4vw, 44px); }
  .ch-head .label { color: var(--crimson); }
  .ch-head h2 { font-size: clamp(2.3rem, 5.6vw, 4.2rem); margin-top: 8px; max-width: 18ch; }

  .ch-grid { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 32px clamp(32px, 5vw, 72px); align-items: start; }
  .ch-aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 22px; min-width: 0; }
  .ozet { margin: 0; font-style: italic; color: var(--muted); font-size: 0.98rem; line-height: 1.6; padding-left: 14px; border-left: 2px solid var(--emerald); }
  .kese { background: var(--wash); border-radius: 4px; padding: 14px 16px; font-family: var(--f-label); font-size: 0.92rem; }
  .kese .label { color: var(--gold); margin-bottom: 6px; }
  .kese ul { list-style: none; margin: 0; padding: 0; }
  .kese li, .kese .total { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .kese li { border-bottom: 1px dashed var(--line); }
  .kese .total { font-weight: 600; padding-top: 8px; }
  .kese .plus { color: var(--emerald); font-weight: 600; }
  .kese .minus { color: var(--crimson); font-weight: 600; }

  .ch-text { min-width: 0; max-width: var(--measure); }
  .ch-text p { margin: 0 0 1.15em; }
  .ch-text p:first-child::first-letter { font-family: var(--f-display); float: left; font-size: 4.2em; line-height: .82; padding: 6px 10px 0 0; color: var(--crimson); }
  .ch-text p:last-child { font-style: italic; }

  .ch-nav { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 40px; font-family: var(--f-label); font-weight: 600; }
  .ch-nav a { text-decoration: none; color: var(--crimson); padding: 8px 0; border-bottom: 1px solid transparent; }
  .ch-nav a:hover { border-bottom-color: var(--crimson); }

  @media (max-width: 820px) {
    .ch-grid { grid-template-columns: minmax(0, 1fr); }
    .ch-aside { position: static; }
  }

  .back { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .back img { width: 88px; height: 88px; object-fit: cover; object-position: center 12%; border-radius: 50%; border: 2px solid var(--crimson); }
  .back h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
  .back a.cta { display: inline-flex; margin-top: 10px; font-family: var(--f-label); font-weight: 600; text-decoration: none; padding: 10px 20px; border-radius: 999px; background: var(--crimson); color: #fff; }
</style>
